[package]
name = "tunnelforge-tests"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
# Core testing dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# HTTP/WebSocket testing
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio-tungstenite = "0.20"
url = "2.4"

# Terminal/process testing
nix = "0.27"
sysinfo = "0.30"

# File system testing
tempfile = "3.8"
dirs = "5.0"

# Async testing
futures = "0.3"

# Platform-specific testing
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-service = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
security-framework = "2.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Test utilities
pretty_assertions = "1.4"
mockall = "0.12"
test-case = "3.3"

[[test]]
name = "integration_tests"
path = "integration/mod.rs"

[[test]]
name = "platform_tests"
path = "platform/mod.rs"

[[test]]
name = "server_tests"
path = "server/mod.rs"