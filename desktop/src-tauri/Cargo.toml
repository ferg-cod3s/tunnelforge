[package]
name = "tunnelforge-desktop"
version = "1.0.0"
description = "TunnelForge Desktop App - Cross-platform terminal sharing"
authors = ["TunnelForge Team"]
license = "MIT"
repository = "https://github.com/ferg-cod3s/tunnelforge"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
# Core Tauri dependencies with minimal features
tauri = { version = "2.3", features = ["tray-icon", "image-ico", "image-png"] }
 tauri-plugin-opener = "2.3"
 tauri-plugin-fs = "2.3"
 tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2.3"
 tauri-plugin-process = "2.3"
 tauri-plugin-log = { version = "2.3", features = ["colored"] }

# Serialization with secure defaults
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

 # Async runtime and utilities
 tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net"] }
 log = { version = "0.4", features = ["release_max_level_info"] }
 env_logger = { version = "0.10", features = ["humantime"] }
 futures = "0.3"
 once_cell = "1.19"

# Error handling and utilities
anyhow = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde", "std"] }
base64 = "0.22"  # Updated from 0.21
rand = "0.8"

# Error tracking and logging
sentry = { version = "0.32", features = ["tracing", "tower", "reqwest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Network security focused dependencies
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }  # Updated from 0.11
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"], default-features = false }  # Updated from 0.20
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots", "connect"], default-features = false }  # Updated from 0.20
futures-util = "0.3"

# Security-focused dependencies
ring = "0.17"  # Cryptographic operations
data-encoding = "2.6"  # Safe data encoding - Updated from 2.4
zeroize = { version = "1.8", features = ["derive"] }  # Secure memory wiping - Updated from 1.6
secrecy = "0.10"  # Secret value handling - Updated from 0.8
rustls = "0.23"  # TLS implementation - Updated from 0.21
webpki-roots = "0.26"  # TLS root certificates - Updated from 0.25
pbkdf2 = "0.12"  # Password-based key derivation

# Windows-specific dependencies with security features
[target.'cfg(windows)'.dependencies]
 winreg = "0.50"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Services", 
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
], default-features = false }

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-desktop-entry = "0.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
 security = ["ring/std", "zeroize/derive"]

[lib]
name = "tunnelforge_desktop"
path = "src/lib.rs"

[[bin]]
name = "tunnelforge"
path = "src/main.rs"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
futures = "0.3"
quickcheck = "1.0"
tempfile = "3.8"
wiremock = "0.6"

# Security-related dependencies with enhanced features
[dependencies.keyring]
version = "2.0"
 features = ["linux-no-secret-service"]

[dependencies.html-escape]
version = "0.2"


[dependencies.regex]
version = "1.9"
features = ["unicode-perl"]

[dependencies.thiserror]
version = "1.0"

[dependencies.url]
version = "2.4"
features = ["serde"]
